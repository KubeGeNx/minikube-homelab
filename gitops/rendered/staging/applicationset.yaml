          \  resources:\n    requests:\n      cpu: 50m\n      memory: 128Mi\ncleanupController:\n  resources:\n\
          \    requests:\n      cpu: 50m\n      memory: 128Mi\nreportsController:\n  resources:\n    requests:\n\
