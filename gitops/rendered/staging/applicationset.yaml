      - component: kube-prometheus-stack
        wave: '2'
        namespace: monitoring
        repoURL: https://prometheus-community.github.io/helm-charts
        chart: kube-prometheus-stack
        targetRevision: 88.5.0
        releaseName: kube-prometheus-stack
        values: "prometheus:\n  prometheusSpec:\n    # Prometheus is no longer the long-term store --\
          \ Mimir is. Its job\n    # narrows to scraping ServiceMonitors and forwarding. 6h of local\n\
          \    # TSDB is enough to ride out a Mimir blip via the remote-write WAL\n    # without keeping\
          \ a second copy of everything.\n    retention: 6h\n    remoteWrite:\n      - url: http://mimir-gateway.mimir.svc/api/v1/push\n\
          \        # The default queue drops on sustained backpressure. Retrying\n        # on 429 is\
          \ what makes the WAL actually cover a Mimir restart.\n        queueConfig:\n          capacity:\
          \ 10000\n          # maxSamplesPerSend, NOT maxSamples. The wrong name is not\n          # rejected\
          \ at apply time -- it makes Argo CD's structured\n          # merge diff fail outright:\n  \
          \        #   ComparisonError: ... .spec.remoteWrite[0].queueConfig\n          #   .maxSamples:\
          \ field not declared in schema\n          # The Application then sits at sync status Unknown\
          \ and stops\n          # applying ANY change to this chart, which silently withheld\n      \
          \    # the whole datasource/correlation config too. A typo in one\n          # field froze the\
          \ entire component.\n          maxSamplesPerSend: 2000\n          maxShards: 50\n          retryOnRateLimit:\
          \ true\n    # Nothing remote-writes INTO Prometheus any more -- Alloy now\n    # writes to Mimir\
          \ directly (gitops/apps/05-alloy.yaml). Leaving the\n    # receiver on would be an open, unauthenticated\
          \ write endpoint for\n    # no reason.\n    enableRemoteWriteReceiver: false\n    resources:\n\
          \      requests:\n        cpu: 100m\n        memory: 512Mi\n    storageSpec:\n      volumeClaimTemplate:\n\
          \        spec:\n          storageClassName: standard\n          accessModes: [\"ReadWriteOnce\"\
          ]\n          resources:\n            requests:\n              # 6h of retention needs far less\
          \ than the old 10Gi.\n              storage: 5Gi\ngrafana:\n  enabled: true\n  sidecar:\n  \
          \  datasources:\n      # The chart marks its own Prometheus datasource isDefault, and\n    \
          \  # Mimir below also claims it -- two defaults is undefined\n      # behaviour in Grafana,\
          \ and the one that wins is whichever the\n      # provisioner happens to load last. Mimir is\
          \ the long-term store\n      # and must be the default, so the chart's claim is dropped.\n \
          \     # Prometheus remains available by uid for its 6h of local data.\n      defaultDatasourceEnabled:\
          \ false\n  adminPassword: HomelabGrafana123!\n  persistence:\n    enabled: true\n    storageClassName:\
          \ standard\n    size: 5Gi\n  # Datasources for the three backends. Explicit uids because the\n\
          \  # correlation links below (tracesToLogsV2, tracesToMetrics,\n  # serviceMap, derivedFields,\
          \ exemplarTraceIdDestinations) reference\n  # datasources BY uid -- letting Grafana autogenerate\
          \ them would make\n  # every one of those jumps unresolvable.\n  #\n  # Tempo and Loki run multitenancy,\
          \ so each datasource pins a tenant\n  # via X-Scope-OrgID. Only `agents` is wired up here.\n\
          \  #\n  # ---------------------------------------------------------------\n  # THE agents-content\
          \ DATASOURCE IS NOT DEFINED HERE, AND THAT IS A\n  # CONSTRAINT, NOT AN OVERSIGHT.\n  #\n  #\
          \ The plan called for it to be restricted to a `content-viewer` role\n  # via Grafana RBAC.\
          \ Datasource-level permissions are a Grafana\n  # ENTERPRISE feature; this stack runs OSS (grafana/grafana:13.2.0,\n\
          \  # verified on the running cluster), where any signed-in user can\n  # query any datasource\
          \ in their org. Adding a content datasource\n  # here would expose prompt/completion text to\
          \ every Grafana user\n  # while looking like it was access-controlled.\n  #\n  # The OSS-compatible\
          \ options, for whoever picks this up:\n  #   1. Grafana ORGS. Datasources are per-org and users\
          \ are members\n  #      of orgs with a role. Provision the content datasource with\n  #    \
          \  `orgId: 2` and add only authorised users to that org. This is\n  #      real isolation in\
          \ OSS and is the recommended path.\n  #   2. Don't expose it in Grafana at all -- query the\
          \ content tenant\n  #      through the Tempo/Loki APIs with a separately held token.\n  #  \
          \ 3. Grafana Enterprise/Cloud, where the original design works.\n  # ---------------------------------------------------------------\n\
          \  additionalDataSources:\n    - name: Loki\n      uid: loki\n      type: loki\n      url: http://loki-gateway.logging.svc\n\
          \      access: proxy\n      jsonData:\n        httpHeaderName1: X-Scope-OrgID\n        # LOG\
          \ -> TRACE. Loki 3 carries trace_id as structured\n        # metadata, so this matches a label\
          \ rather than regex-scraping\n        # the log line -- which is both faster and immune to format\n\
          \        # changes in the message itself.\n        derivedFields:\n          - name: TraceID\n\
          \            matcherType: label\n            matcherRegex: trace_id\n            url: \"${__value.raw}\"\
          \n            datasourceUid: tempo\n            urlDisplayLabel: View trace\n      secureJsonData:\n\
          \        httpHeaderValue1: agents\n    - name: Tempo\n      uid: tempo\n      type: tempo\n\
          \      # query-frontend serves reads; the distributor only ingests.\n      url: http://tempo-query-frontend.tracing.svc:3200\n\
          \      access: proxy\n      jsonData:\n        httpHeaderName1: X-Scope-OrgID\n        # TRACE\
          \ -> LOGS. The time shift matters: a log line is written\n        # at some point during the\
          \ span, not at its start instant, and\n        # without a window either side the jump lands\
          \ on an empty\n        # result and looks broken.\n        tracesToLogsV2:\n          datasourceUid:\
          \ loki\n          spanStartTimeShift: -5m\n          spanEndTimeShift: 5m\n          filterByTraceID:\
          \ true\n          filterBySpanID: false\n          tags:\n            # service.name -> service_name.\
          \ This mapping only holds\n            # because k8sattributes sets the resource attribute in\
          \ the\n            # agent tier. A workload that overrides OTEL_SERVICE_NAME\n            #\
          \ to something the log labels don't carry makes this jump\n            # silently return nothing.\n\
          \            - key: service.name\n              value: service_name\n        # TRACE -> METRICS,\
          \ using the spanmetrics the agent tier\n        # derives PRE-sampling, so these rates are real\
          \ traffic rather\n        # than the ~10% that survived tail sampling.\n        tracesToMetrics:\n\
          \          datasourceUid: mimir\n          spanStartTimeShift: -5m\n          spanEndTimeShift:\
          \ 5m\n          tags:\n            - key: service.name\n              value: service_name\n\
          \          queries:\n            - name: Request rate\n              query: sum(rate(traces_span_metrics_calls_total{$__tags}[$__rate_interval]))\n\
          \            - name: Error rate\n              query: sum(rate(traces_span_metrics_calls_total{$__tags,status_code=\"\
          STATUS_CODE_ERROR\"}[$__rate_interval]))\n            - name: p95 duration\n              query:\
          \ histogram_quantile(0.95, sum(rate(traces_span_metrics_duration_seconds_bucket{$__tags}[$__rate_interval]))\
          \ by (le))\n        # SERVICE MAP. Reads traces_service_graph_request_* -- produced\n      \
          \  # by the servicegraph connector, NOT by spanmetrics. Without\n        # that connector this\
          \ panel is permanently empty.\n        serviceMap:\n          datasourceUid: mimir\n       \
          \ nodeGraph:\n          enabled: true\n      secureJsonData:\n        httpHeaderValue1: agents\n\
          \    # Long-term metrics. The stack's own Prometheus datasource stays\n    # and still works,\
          \ but it only holds 6h -- anything historical has\n    # to be queried here, which is why this\
          \ is the default.\n    - name: Mimir\n      uid: mimir\n      type: prometheus\n      url: http://mimir-gateway.mimir.svc/prometheus\n\
          \      access: proxy\n      isDefault: true\n      jsonData:\n        timeInterval: 30s\n  \
          \      # METRIC -> TRACE. Requires exemplars to survive the whole\n        # path: emitted by\
          \ the spanmetrics connector (exemplars.enabled\n        # in 26-otel-agent.yaml) and stored\
          \ by Mimir\n        # (max_global_exemplars_per_user in 28-mimir.yaml, which\n        # defaults\
          \ to 0 = silently discard).\n        exemplarTraceIdDestinations:\n          - name: trace_id\n\
          \            datasourceUid: tempo\nalertmanager:\n  enabled: true\n  alertmanagerSpec:\n   \
          \ resources:\n      requests:\n        cpu: 25m\n        memory: 64Mi\nkubeStateMetrics:\n \
          \ enabled: true\nnodeExporter:\n  enabled: true\nprometheusOperator:\n  resources:\n    requests:\n\
          \      cpu: 50m\n      memory: 128Mi\n"
      - component: tempo
        wave: '3'
        namespace: tracing
        repoURL: https://grafana.github.io/helm-charts
        chart: tempo-distributed
        targetRevision: 1.61.3
        releaseName: tempo
        values: "# Every read and write must carry X-Scope-OrgID once this is on.\nmultitenancyEnabled:\
          \ true\n# Grafana derives Tempo search streaming from the datasource HTTP URL\n# (port 3200).\
          \ Enable Tempo's HTTP streaming endpoint rather than\n# making Grafana attempt gRPC against\
          \ that port.\nstream_over_http_enabled: true\n\ntraces:\n  otlp:\n    grpc:\n      enabled:\
          \ true\n    http:\n      enabled: true\n\nstorage:\n  trace:\n    backend: s3\n    s3:\n   \
          \   bucket: tempo\n      endpoint: seaweedfs-s3.seaweedfs.svc:8333\n      region: us-east-1\n\
          \      access_key: homelab-admin\n      secret_key: HomelabSeaweedAdminKey123!\n      # In-cluster\
          \ SeaweedFS speaks plain HTTP; insecure here means \"no\n      # TLS on the S3 connection\"\
          , not \"skip verification\".\n      insecure: true\n      forcepathstyle: true\n\n# 30d default.\
          \ The content tenant is cut to 7d below -- prompt and\n# completion text is the shortest-lived\
          \ thing in the platform.\noverrides:\n  defaults:\n    compaction:\n      block_retention: 720h\n\
          # A per-tenant override block REPLACES that tenant's limits wholesale --\n# it does not merge\
          \ with `overrides.defaults`. Specifying only\n# block_retention here therefore set every other\
          \ limit to zero, and\n# Tempo rejected every write to this tenant:\n#\n#   RATE_LIMITED: batch\
          \ size (1506 bytes) exceeds ingestion limit\n#   (local: 0 bytes/s, global: 0 bytes/s, burst:\
          \ 0 bytes)\n#   for user agents-content\n#\n# Nastier than it sounds: the collector's routing\
          \ was working\n# perfectly, the gateway logged \"Exporting failed. Dropping data\", and\n# the\
          \ tenant simply stayed empty -- so it looked like the content\n# routing was broken rather than\
          \ the tenant's limits. The chart's own\n# values file warns that all values must be given for\
          \ each per-tenant\n# block; these mirror Tempo's defaults.\nper_tenant_overrides:\n  agents-content:\n\
          \    compaction:\n      block_retention: 168h\n    ingestion:\n      rate_limit_bytes: 15000000\n\
          \      burst_size_bytes: 20000000\n      max_traces_per_user: 10000\n    global:\n      max_bytes_per_trace:\
          \ 5000000\n\ndistributor:\n  replicas: 2\n  resources:\n    requests:\n      cpu: 100m\n   \
          \   memory: 256Mi\n    limits:\n      memory: 1Gi\n\n# Quorum-based: with replication_factor\
          \ 3 the ring tolerates losing\n# one ingester without dropping writes.\ningester:\n  replicas:\
          \ 3\n  persistence:\n    enabled: true\n    storageClass: standard\n    size: 10Gi\n  resources:\n\
          \    requests:\n      cpu: 200m\n      memory: 512Mi\n    limits:\n      memory: 2Gi\n\ncompactor:\n\
          \  replicas: 1\n  resources:\n    requests:\n      cpu: 100m\n      memory: 256Mi\n    limits:\n\
          \      memory: 1Gi\n\nquerier:\n  replicas: 2\n  resources:\n    requests:\n      cpu: 100m\n\
          \      memory: 256Mi\n    limits:\n      memory: 1Gi\n\nqueryFrontend:\n  replicas: 1\n  resources:\n\
          \    requests:\n      cpu: 50m\n      memory: 128Mi\n    limits:\n      memory: 512Mi\n\n# See\
          \ header: the otel-agent tier owns span metrics and service\n# graphs, pre-sampling. Turning\
          \ this on would double-publish them.\nmetricsGenerator:\n  enabled: false\n\n# The chart ships\
          \ memcached for query caching; useful, but it is\n# another stateful thing to run. Off until\
          \ query latency justifies it.\nmemcached:\n  enabled: false\n"
      - component: alloy
        wave: '4'
        namespace: alloy
        repoURL: https://grafana.github.io/helm-charts
        chart: alloy
        targetRevision: 1.11.1
        releaseName: alloy
        values: "controller:\n  type: statefulset\n  replicas: 1\nalloy:\n  resources:\n    requests:\n\
          \      cpu: 50m\n      memory: 256Mi\n  configMap:\n    content: |\n      // ---- Logs: all\
          \ pod logs -> Loki ----\n      discovery.kubernetes \"pods\" {\n        role = \"pod\"\n   \
          \   }\n\n      loki.source.kubernetes \"pods\" {\n        targets    = discovery.kubernetes.pods.targets\n\
          \        forward_to = [loki.write.default.receiver]\n      }\n\n      loki.write \"default\"\
          \ {\n        endpoint {\n          // loki-gateway is the nginx front door of the simple-scalable\n\
          \          // deployment; it fronts read and write. The old loki-stack\n          // single\
          \ service is gone.\n          url = \"http://loki-gateway.logging.svc/loki/api/v1/push\"\n \
          \         // Loki now runs auth_enabled, so a tenant is mandatory on\n          // every write.\
          \ Infrastructure logs go to `agents`; the\n          // `agents-content` tenant is reserved\
          \ for prompt/completion\n          // records and has 7d retention.\n          tenant_id = \"\
          agents\"\n        }\n      }\n\n      // ---- Metrics: annotated pods -> Mimir ----\n      discovery.relabel\
          \ \"scrape_pods\" {\n        targets = discovery.kubernetes.pods.targets\n        rule {\n \
          \         source_labels = [\"__meta_kubernetes_pod_annotation_prometheus_io_scrape\"]\n    \
          \      regex         = \"true\"\n          action        = \"keep\"\n        }\n      }\n\n\
          \      prometheus.scrape \"pods\" {\n        targets    = discovery.relabel.scrape_pods.output\n\
          \        forward_to = [prometheus.remote_write.default.receiver]\n      }\n\n      prometheus.remote_write\
          \ \"default\" {\n        endpoint {\n          // Mimir is the long-term store now. Writing\
          \ to Prometheus's\n          // remote-write receiver would land these in a TSDB that only\n\
          \          // keeps a few hours.\n          url = \"http://mimir-gateway.mimir.svc/api/v1/push\"\
          \n        }\n      }\n\n      // ---- Traces: REMOVED ----\n      // Alloy used to accept OTLP\
          \ and forward straight to Tempo. That\n      // is now a liability rather than a convenience:\
          \ it was a second\n      // door into the trace backend that bypassed everything the\n     \
          \ // collector tiers exist to do -- no k8sattributes enrichment, no\n      // redaction of prompt\
          \ content, no spanmetrics, and no tail\n      // sampling. Traces arriving that way would be\
          \ inconsistent with\n      // every other trace in the system and would quietly defeat the\n\
          \      // content-redaction guarantee.\n      //\n      // Applications send OTLP to the otel-agent\
          \ DaemonSet instead:\n      //   otel-agent-opentelemetry-collector.otel.svc:4317\n      //\
          \ See gitops/apps/26-otel-agent.yaml.\n"
      - component: loki
        wave: '3'
        namespace: logging
        repoURL: https://grafana.github.io/helm-charts
        chart: loki
        targetRevision: 7.3.0
        releaseName: loki
        values: "deploymentMode: SimpleScalable\n\nloki:\n  # Multitenancy. Despite the name this is not\
          \ authentication -- Loki\n  # trusts the X-Scope-OrgID header; it is tenant SEPARATION, and\
          \ the\n  # actual access control is Grafana's RBAC over the datasources (W4).\n  auth_enabled:\
          \ true\n\n  # Loki 3 refuses to start without an explicit schema. tsdb + v13 is\n  # the only\
          \ combination that supports structured metadata, which is\n  # the whole reason for this migration.\n\
          \  schemaConfig:\n    configs:\n      - from: \"2024-04-01\"\n        store: tsdb\n        object_store:\
          \ s3\n        schema: v13\n        index:\n          prefix: loki_index_\n          period:\
          \ 24h\n\n  storage:\n    type: s3\n    bucketNames:\n      chunks: loki\n      ruler: loki\n\
          \      admin: loki\n    s3:\n      endpoint: http://seaweedfs-s3.seaweedfs.svc:8333\n      region:\
          \ us-east-1\n      accessKeyId: homelab-admin\n      secretAccessKey: HomelabSeaweedAdminKey123!\n\
          \      # SeaweedFS S3 uses path-style addressing here.\n      s3ForcePathStyle: true\n     \
          \ insecure: true\n\n  limits_config:\n    retention_period: 720h\n    # Required for trace_id/span_id\
          \ as structured metadata.\n    allow_structured_metadata: true\n    volume_enabled: true\n \
          \   # OTLP log records arrive with resource attributes; without a\n    # raised limit the long\
          \ ones get dropped.\n    max_line_size: 256kb\n    ingestion_rate_mb: 16\n    ingestion_burst_size_mb:\
          \ 32\n\n  # Retention only actually happens if the compactor is told to do it.\n  # Setting\
          \ retention_period alone silently keeps everything forever,\n  # which for the content tenant\
          \ would defeat the whole policy.\n  compactor:\n    retention_enabled: true\n    delete_request_store:\
          \ s3\n\n  # Per-tenant overrides. The content tenant is cut to 7d.\n  runtimeConfig:\n    overrides:\n\
          \      agents-content:\n        retention_period: 168h\n\nwrite:\n  replicas: 2\n  persistence:\n\
          \    storageClass: standard\n    size: 10Gi\n  resources:\n    requests:\n      cpu: 100m\n\
          \      memory: 512Mi\n    limits:\n      memory: 2Gi\n\nread:\n  replicas: 2\n  persistence:\n\
          \    storageClass: standard\n    size: 10Gi\n  resources:\n    requests:\n      cpu: 100m\n\
          \      memory: 512Mi\n    limits:\n      memory: 2Gi\n\nbackend:\n  replicas: 2\n  persistence:\n\
          \    storageClass: standard\n    size: 10Gi\n  resources:\n    requests:\n      cpu: 100m\n\
          \      memory: 512Mi\n    limits:\n      memory: 2Gi\n\n# nginx in front of read/write; this\
          \ is the single endpoint clients\n# talk to, and what Alloy and Grafana are pointed at.\ngateway:\n\
          \  enabled: true\n  replicas: 2\n  resources:\n    requests:\n      cpu: 50m\n      memory:\
          \ 128Mi\n    limits:\n      memory: 256Mi\n\n# The chart defaults chunksCache to 8Gi of memcached,\
          \ which is a\n# production-cluster number and would not schedule here.\nchunksCache:\n  enabled:\
          \ true\n  allocatedMemory: 2048\nresultsCache:\n  enabled: true\n\n# Synthetic log producer\
          \ used to measure Loki's own health. Useful,\n# but it writes to a tenant of its own and adds\
          \ noise -- revisit with\n# the meta-monitoring workstream rather than enabling it by default.\n\
          lokiCanary:\n  enabled: false\ntest:\n  enabled: false\n"
      - component: mimir
        wave: '3'
        namespace: mimir
        repoURL: https://grafana.github.io/helm-charts
        chart: mimir-distributed
        targetRevision: 6.2.0
        releaseName: mimir
        values: "# SeaweedFS is the platform object store, outside this chart.\nminio:\n  enabled: false\n\
          \n# Chart 6.2.0 defaults to Mimir's INGEST-STORAGE architecture, which\n# routes every write\
          \ through Kafka before it reaches an ingester, and\n# ships a single-replica `apache/kafka-native`\
          \ StatefulSet to do it.\n# That bundled Kafka is a getting-started convenience: it would sit\
          \ in\n# the write path of every metric in the platform as a brand new single\n# point of failure,\
          \ which is strictly worse than the classic path it\n# replaces. Disabled here in favour of the\
          \ well-trodden zone-aware\n# architecture (3 ingester zones, replication factor 3).\n#\n# Revisit\
          \ only with a real Kafka (Strimzi, MSK) behind it -- the\n# architecture is sound, the bundled\
          \ broker is not.\nkafka:\n  enabled: false\n\nmimir:\n  structuredConfig:\n    multitenancy_enabled:\
          \ false\n\n    # The chart's base config hardcodes this on; structuredConfig\n    # merges over\
          \ it. Must be false or the ingesters look for a Kafka\n    # broker that no longer exists.\n\
          \    ingest_storage:\n      enabled: false\n\n    ingester:\n      # The other half of turning\
          \ ingest-storage off, and it is NOT\n      # optional. Chart 6.2.0 also hardcodes\n      # `ingester.push_grpc_method_enabled:\
          \ false`, because with\n      # ingest-storage the write path goes through Kafka and the gRPC\n\
          \      # Push method is deliberately closed. Disable ingest-storage\n      # without re-opening\
          \ Push and every ingester refuses to start:\n      #\n      #   error validating config: cannot\
          \ disable Push gRPC method in\n      #   ingester, while ingest storage (-ingest-storage.enabled)\
          \ is\n      #   not enabled\n      #\n      # Found by running it -- the config renders and\
          \ parses fine, and\n      # `mimirtool`/`-modules` validation passes, because the two\n    \
          \  # settings are only invalid *in combination* at startup.\n      push_grpc_method_enabled:\
          \ true\n\n    # One bucket, three prefixes. Mimir refuses to start if blocks,\n    # ruler and\
          \ alertmanager storage collide, so they are separated by\n    # storage_prefix rather than by\
          \ provisioning three buckets.\n    common:\n      storage:\n        backend: s3\n        s3:\n\
          \          endpoint: seaweedfs-s3.seaweedfs.svc:8333\n          region: us-east-1\n        \
          \  bucket_name: mimir\n          access_key_id: homelab-admin\n          secret_access_key:\
          \ HomelabSeaweedAdminKey123!\n          insecure: true\n          bucket_lookup_type: path\n\
          \n    blocks_storage:\n      backend: s3\n      storage_prefix: blocks\n      s3:\n        bucket_name:\
          \ mimir\n    ruler_storage:\n      backend: s3\n      storage_prefix: ruler\n      s3:\n   \
          \     bucket_name: mimir\n\n    limits:\n      # 30d of history. Compaction enforces it.\n \
          \     compactor_blocks_retention_period: 720h\n      # Exemplars default to 0 -- i.e. Mimir\
          \ accepts them on the wire\n      # and silently throws them away. That failure mode is invisible:\n\
          \      # the collector reports exemplars sent, Mimir reports no error,\n      # and Grafana\
          \ just never shows a dot to click. This is the switch\n      # that makes metric -> trace work\
          \ at all.\n      max_global_exemplars_per_user: 100000\n      # Headroom for the spanmetrics/servicegraph\
          \ series the agent\n      # tier produces, which are per service x span name x status.\n   \
          \   max_global_series_per_user: 1500000\n      ingestion_rate: 100000\n      ingestion_burst_size:\
          \ 200000\n      # MUST be set explicitly. Mimir's default is FALSE -- verified on\n      # a\
          \ running cluster, where gen_ai.client.operation.duration (unit\n      # \"s\") landed as gen_ai_client_operation_duration_count\
          \ with no\n      # _seconds. Every alert rule and dashboard query written against\n      # the\
          \ conventional OTLP->Prometheus names would match nothing.\n      #\n      # With this true,\
          \ names match what the collector's own prometheus\n      # exporter produces, which is what\
          \ the rules in\n      # gitops/platform/ai-governance-rules.yaml were measured against.\n  \
          \    otel_metric_suffixes_enabled: true\n      #\n      # NOTE on resource attributes: there\
          \ is no promote_resource_\n      # attributes limit in Mimir 3.2.0 (verified -- the binary rejects\n\
          \      # it as \"field not found in type validation.plainLimits\"). OTLP\n      # ingest folds\
          \ resource attributes into the target_info metric,\n      # except service.name/service.namespace\
          \ which become `job` and\n      # service.instance.id which becomes `instance`. So filtering\n\
          \      # spanmetrics by service works out of the box via job=; filtering\n      # by pod or\
          \ node needs a join against target_info.\n\n    ruler:\n      # Recording and alerting rules\
          \ evaluate here, but routing stays\n      # with the Alertmanager that kube-prometheus-stack\
          \ already runs\n      # -- two Alertmanagers means two places to look during an\n      # incident.\n\
          \      alertmanager_url: http://kube-prometheus-stack-alertmanager.monitoring.svc:9093\n\n#\
          \ kube-prometheus-stack's Alertmanager is the single routing point.\nalertmanager:\n  enabled:\
          \ false\n\ndistributor:\n  replicas: 2\ningester:\n  replicas: 3\n  persistentVolume:\n    storageClass:\
          \ standard\n    size: 10Gi\nquerier:\n  replicas: 2\nquery_frontend:\n  replicas: 1\nstore_gateway:\n\
          \  replicas: 1\n  persistentVolume:\n    storageClass: standard\n    size: 10Gi\ncompactor:\n\
          \  replicas: 1\n  persistentVolume:\n    storageClass: standard\n    size: 10Gi\nruler:\n  replicas:\
          \ 1\n\n# nginx in front of the read/write paths -- the single endpoint the\n# collector, Prometheus\
          \ remote-write, and Grafana all talk to.\ngateway:\n  enabledNonEnterprise: true\n  replicas:\
          \ 2\n"
