# Argo CD runs with server.insecure=true (scripts/03-argocd.sh) so the
# Gateway terminates TLS and forwards plain HTTP.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: argocd
  namespace: argocd
spec:
  parentRefs:
    - name: platform
      namespace: envoy-gateway-system
  hostnames:
    - argocd.lab.local
  rules:
    - backendRefs:
        - name: argocd-server
          port: 80
