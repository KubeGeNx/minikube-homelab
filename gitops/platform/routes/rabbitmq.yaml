# RabbitMQ management UI. Login with the auth.* credentials from
# gitops/apps/25-rabbitmq.yaml (homelab / HomelabRabbit123!).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: rabbitmq
  namespace: rabbitmq
spec:
  parentRefs:
    - name: platform
      namespace: envoy-gateway-system
  hostnames:
    - rabbitmq.lab.local
  rules:
    - backendRefs:
        - name: rabbitmq
          port: 15672
