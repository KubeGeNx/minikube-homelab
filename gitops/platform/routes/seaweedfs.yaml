# SeaweedFS S3 endpoint (kept cluster-internal; this route is for local testing).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: seaweedfs
  namespace: seaweedfs
spec:
  parentRefs:
    - name: platform
      namespace: envoy-gateway-system
  hostnames:
    - seaweedfs.lab.local
  rules:
    - backendRefs:
        - name: seaweedfs-s3
          port: 8333
