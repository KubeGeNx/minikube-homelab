apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: tempo
  namespace: tracing
spec:
  parentRefs:
    - name: platform
      namespace: envoy-gateway-system
  hostnames:
    - tempo.lab.local
  rules:
    - backendRefs:
        # tempo-distributed splits ingest from query: the distributor takes
        # writes, the query-frontend serves the read API. This route is for
        # humans and Grafana, so it points at the query path. The monolith's
        # single `tempo` service on 3100 no longer exists.
        - name: tempo-query-frontend
          port: 3200
