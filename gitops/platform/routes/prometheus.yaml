apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: prometheus
  namespace: monitoring
spec:
  parentRefs:
    - name: platform
      namespace: envoy-gateway-system
  hostnames:
    - prometheus.lab.local
  rules:
    - backendRefs:
        - name: kube-prometheus-stack-prometheus
          port: 9090
