apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: envoy-gateway
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: default
  source:
    # OCI chart. docker.io/envoyproxy is registered as a Helm OCI
    # repository by scripts/03-argocd.sh (secret repo-envoyproxy-oci,
    # enableOCI) -- the repoURL here must match that registration exactly,
    # i.e. NO oci:// scheme and the registry namespace only (Argo CD
    # appends `chart` to it).
    repoURL: docker.io/envoyproxy
    chart: gateway-helm
    targetRevision: ${ENVOY_GATEWAY_VERSION}
    helm:
      releaseName: eg
  destination:
    server: https://kubernetes.default.svc
    namespace: envoy-gateway-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
