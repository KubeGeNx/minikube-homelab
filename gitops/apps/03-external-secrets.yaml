apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  source:
    repoURL: https://charts.external-secrets.io
    chart: external-secrets
    targetRevision: ${EXTERNAL_SECRETS_VERSION}
    helm:
      releaseName: external-secrets
      values: |
        # CRD installation is on by default in modern ESO charts (crds.*
        # values). The old `installCRDs: true` was REMOVED from the chart's
        # values.schema.json -- passing it makes `helm template` fail schema
        # validation, which surfaces as OutOfSync/Degraded in Argo CD.
        crds:
          createClusterExternalSecret: true
          createClusterSecretStore: true
  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # ESO's CRDs are far too large for client-side apply (the
      # last-applied-configuration annotation blows the 262KB limit), which
      # silently leaves the CRDs out and the controller crash-looping on
      # "cache sync timed out" for ClusterSecretStore.
      - ServerSideApply=true
