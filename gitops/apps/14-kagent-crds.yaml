# kagent (kagent.dev) CRDs -- separate chart so the CRDs land before the
# controller (wave 1 vs 2). Shares KAGENT_ENABLED with 15-kagent.yaml.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kagent-crds
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  source:
    repoURL: https://kagent-dev.github.io/kagent
    chart: kagent-crds
    targetRevision: ${KAGENT_VERSION}
    helm:
      releaseName: kagent-crds
  destination:
    server: https://kubernetes.default.svc
    namespace: kagent
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
