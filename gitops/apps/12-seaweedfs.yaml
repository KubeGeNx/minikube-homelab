# SeaweedFS S3 object store for Tempo, Loki, Mimir, and Velero.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: seaweedfs
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  project: default
  source:
    repoURL: https://seaweedfs.github.io/seaweedfs/helm
    chart: seaweedfs
    targetRevision: ${SEAWEEDFS_CHART_VERSION}
    helm:
      releaseName: seaweedfs
      values: |
        master:
          replicas: 1
          data:
            type: persistentVolumeClaim
            size: 1Gi
            storageClass: standard
        volume:
          replicas: 1
          dataDirs:
            - name: data
              type: persistentVolumeClaim
              size: 20Gi
              storageClass: standard
              maxVolumes: 0
        s3:
          enabled: true
          port: 8333
          replicas: 1
          enableAuth: true
          credentials:
            admin:
              accessKey: homelab-admin
              secretKey: HomelabSeaweedAdminKey123!
          createBuckets:
            - name: tempo
            - name: loki
            - name: mimir
            - name: velero-backups
  destination:
    server: https://kubernetes.default.svc
    namespace: seaweedfs
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
