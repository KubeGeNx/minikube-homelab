# OpenTelemetry Collector in GATEWAY mode (a single Deployment that apps
# send OTLP to), as opposed to agent/DaemonSet mode.
#
# Where this sits relative to Alloy: Alloy (gitops/apps/05-alloy.yaml) is
# the cluster-wide collector for logs -> Loki and pod metrics -> Prometheus,
# and it also accepts OTLP. This gateway is the vendor-neutral OTLP front
# door for *application* telemetry: apps point at otel-collector.otel.svc
# and the gateway forwards traces to Tempo. Both paths end at the same
# Tempo, so a span reaches the same place either way -- the gateway just
# gives applications a standard OTLP endpoint that doesn't couple them to
# Alloy's config, and adds Kubernetes resource attributes on the way
# through (k8sattributes via the chart's kubernetesAttributes preset, which
# also creates the ClusterRole it needs to read pod metadata).
#
# The .NET sample in examples/dotnet-rabbitmq/ publishes to this endpoint.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: otel-collector
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    # Wave 4: must come up after Tempo (wave 3), which it exports to.
    argocd.argoproj.io/sync-wave: "4"
spec:
  project: default
  source:
    repoURL: https://open-telemetry.github.io/opentelemetry-helm-charts
    chart: opentelemetry-collector
    targetRevision: ${OTEL_COLLECTOR_CHART_VERSION}
    helm:
      releaseName: otel-collector
      values: |
        mode: deployment
        replicaCount: 1
        image:
          repository: otel/opentelemetry-collector-contrib
        command:
          name: otelcol-contrib
        presets:
          kubernetesAttributes:
            enabled: true
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            memory: 512Mi
        ports:
          otlp:
            enabled: true
          otlp-http:
            enabled: true
          jaeger-compact:
            enabled: false
          jaeger-thrift:
            enabled: false
          jaeger-grpc:
            enabled: false
          zipkin:
            enabled: false
        config:
          receivers:
            otlp:
              protocols:
                grpc:
                  endpoint: 0.0.0.0:4317
                http:
                  endpoint: 0.0.0.0:4318
          processors:
            # memory_limiter must be FIRST in each pipeline: it sheds load
            # by refusing data before the batch processor buffers it.
            memory_limiter:
              check_interval: 5s
              limit_percentage: 80
              spike_limit_percentage: 25
            batch:
              timeout: 5s
              send_batch_size: 1024
          exporters:
            otlp/tempo:
              endpoint: tempo.tracing.svc:4317
              tls:
                insecure: true
          service:
            # metrics/logs are explicitly nulled to drop the chart's default
            # pipelines -- Prometheus scrapes and Alloy->Loki already cover
            # those, and leaving them on would double-ship. Helm removes a
            # key whose override value is null.
            pipelines:
              traces:
                receivers: [otlp]
                processors: [memory_limiter, k8sattributes, batch]
                exporters: [otlp/tempo]
              metrics: null
              logs: null
  destination:
    server: https://kubernetes.default.svc
    namespace: otel
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
