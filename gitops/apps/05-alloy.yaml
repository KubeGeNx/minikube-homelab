# Grafana Alloy: INFRASTRUCTURE collector. Ships pod logs -> Loki and scrapes
# prometheus.io/scrape-annotated pods -> Mimir. Runs as a single-replica
# StatefulSet (not a DaemonSet) so loki.source.kubernetes doesn't tail every
# pod once per node.
#
# Division of labour with the OpenTelemetry collectors, which is worth being
# precise about because both are "collectors":
#   Alloy         -- infrastructure telemetry it discovers by scraping/tailing.
#   otel-agent    -- APPLICATION telemetry that applications push to it.
# Alloy no longer accepts traces at all; see the Traces section below.
#
# Both ends changed in W3: Loki 3 replaced loki-stack (whose promtail this
# always superseded), and Mimir replaced Prometheus as the metrics store.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: alloy
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: "4"
spec:
  project: default
  source:
    repoURL: https://grafana.github.io/helm-charts
    chart: alloy
    targetRevision: ${ALLOY_CHART_VERSION}
    helm:
      releaseName: alloy
      values: |
        controller:
          type: statefulset
          replicas: 1
        alloy:
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
          configMap:
            content: |
              // ---- Logs: all pod logs -> Loki ----
              discovery.kubernetes "pods" {
                role = "pod"
              }

              loki.source.kubernetes "pods" {
                targets    = discovery.kubernetes.pods.targets
                forward_to = [loki.write.default.receiver]
              }

              loki.write "default" {
                endpoint {
                  // loki-gateway is the nginx front door of the simple-scalable
                  // deployment; it fronts read and write. The old loki-stack
                  // single service is gone.
                  url = "http://loki-gateway.logging.svc/loki/api/v1/push"
                  // Loki now runs auth_enabled, so a tenant is mandatory on
                  // every write. Infrastructure logs go to `agents`; the
                  // `agents-content` tenant is reserved for prompt/completion
                  // records and has 7d retention.
                  tenant_id = "agents"
                }
              }

              // ---- Metrics: annotated pods -> Mimir ----
              discovery.relabel "scrape_pods" {
                targets = discovery.kubernetes.pods.targets
                rule {
                  source_labels = ["__meta_kubernetes_pod_annotation_prometheus_io_scrape"]
                  regex         = "true"
                  action        = "keep"
                }
              }

              prometheus.scrape "pods" {
                targets    = discovery.relabel.scrape_pods.output
                forward_to = [prometheus.remote_write.default.receiver]
              }

              prometheus.remote_write "default" {
                endpoint {
                  // Mimir is the long-term store now. Writing to Prometheus's
                  // remote-write receiver would land these in a TSDB that only
                  // keeps a few hours.
                  url = "http://mimir-gateway.mimir.svc/api/v1/push"
                }
              }

              // ---- Traces: REMOVED ----
              // Alloy used to accept OTLP and forward straight to Tempo. That
              // is now a liability rather than a convenience: it was a second
              // door into the trace backend that bypassed everything the
              // collector tiers exist to do -- no k8sattributes enrichment, no
              // redaction of prompt content, no spanmetrics, and no tail
              // sampling. Traces arriving that way would be inconsistent with
              // every other trace in the system and would quietly defeat the
              // content-redaction guarantee.
              //
              // Applications send OTLP to the otel-agent DaemonSet instead:
              //   otel-agent-opentelemetry-collector.otel.svc:4317
              // See gitops/apps/26-otel-agent.yaml.
  destination:
    server: https://kubernetes.default.svc
    namespace: alloy
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
