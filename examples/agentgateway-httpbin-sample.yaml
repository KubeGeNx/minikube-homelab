# Sample: agentgateway + httpbin, straight from the official guide
# (https://agentgateway.dev/docs/kubernetes/latest/install/sample-app/).
#
# Prereq: the agentgateway component is installed (`make agentgateway`).
#
#   kubectl apply -f examples/agentgateway-httpbin-sample.yaml
#   # or run the whole test end-to-end:
#   ./scripts/10-agentgateway-sample-test.sh
#
# Then (local testing without a LoadBalancer):
#   kubectl port-forward deployment/agentgateway-proxy -n agentgateway-system 8080:80
#   curl -i localhost:8080/headers -H "host: www.example.com"
#
# Clean up:
#   kubectl delete -f examples/agentgateway-httpbin-sample.yaml
---
# The Gateway. The agentgateway control plane sees gatewayClassName
# "agentgateway" and creates an agentgateway-proxy Deployment + Service
# in agentgateway-system.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: agentgateway-proxy
  namespace: agentgateway-system
spec:
  gatewayClassName: agentgateway
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: All
---
apiVersion: v1
kind: Namespace
metadata:
  name: httpbin
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: httpbin
  namespace: httpbin
---
apiVersion: v1
kind: Service
metadata:
  name: httpbin
  namespace: httpbin
  labels:
    app: httpbin
    service: httpbin
spec:
  ports:
    - name: http
      port: 8000
      targetPort: 8080
  selector:
    app: httpbin
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: httpbin
  namespace: httpbin
spec:
  replicas: 1
  selector:
    matchLabels:
      app: httpbin
      version: v1
  template:
    metadata:
      labels:
        app: httpbin
        version: v1
    spec:
      serviceAccountName: httpbin
      containers:
        - name: httpbin
          image: docker.io/mccutchen/go-httpbin:v2.14.0
          command: ["go-httpbin"]
          args: ["-port", "8080"]
          ports:
            - containerPort: 8080
---
# Route www.example.com through the agentgateway proxy to httpbin.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: httpbin
  namespace: httpbin
spec:
  parentRefs:
    - name: agentgateway-proxy
      namespace: agentgateway-system
  hostnames:
    - "www.example.com"
  rules:
    - backendRefs:
        - name: httpbin
          port: 8000
