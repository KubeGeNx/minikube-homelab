# Sample: a ClusterPolicy that requires a `team` label on every Pod in the
# kyverno-demo namespace, plus one Pod that violates it and one that
# complies -- apply them separately to see enforcement in action.
#
# Prereq: the kyverno component is installed (`make kyverno`).
#
#   kubectl apply -f examples/kyverno-policy-sample.yaml
#
# `kubectl apply` processes each document independently, so the bad-pod
# document is rejected by the admission webhook (you'll see an "admission
# webhook ... denied the request" error) while the namespace, policy, and
# good-pod documents still apply successfully. To see just the rejection or
# just the success in isolation, extract and apply each Pod on its own with
# `kubectl apply -f - <<EOF ... EOF` or `yq`.
#
# Clean up:
#   kubectl delete -f examples/kyverno-policy-sample.yaml
---
apiVersion: v1
kind: Namespace
metadata:
  name: kyverno-demo
---
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-team-label
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: check-team-label
      match:
        any:
          - resources:
              kinds:
                - Pod
              namespaces:
                - kyverno-demo
      validate:
        message: "A 'team' label is required on Pods in kyverno-demo."
        pattern:
          metadata:
            labels:
              team: "?*"
---
# Rejected: no `team` label.
apiVersion: v1
kind: Pod
metadata:
  name: bad-pod
  namespace: kyverno-demo
spec:
  containers:
    - name: nginx
      image: nginx:1.27
---
# Allowed: has the required `team` label.
apiVersion: v1
kind: Pod
metadata:
  name: good-pod
  namespace: kyverno-demo
  labels:
    team: platform
spec:
  containers:
    - name: nginx
      image: nginx:1.27
